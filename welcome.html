<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome — CarboSteps</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --nearwhite:#FAFAF9; --offwhite:#F2F2F0; --sand:#F2EBDC; --frame-light:#F9F6F0;
    --carbon:#1A1A1A; --anthracite:#3A3A3A; --steel:#8A8A8A;
    --rouge:#F60000; --rouge-hover:#C20000;
    --hair:rgba(26,26,26,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--nearwhite);color:var(--anthracite);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1200px;margin:0 auto;padding:0 32px}

  /* NAV */
  .nav{position:sticky;top:0;z-index:50;background:var(--nearwhite);border-bottom:1px solid var(--hair)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:72px;position:relative}
  .logo img{height:30px;width:auto;display:block}
  .nav-right{display:flex;align-items:center;gap:32px}
  .nav-links{display:flex;gap:28px;list-style:none}
  .nav-links a{font-size:15px;font-weight:500;color:var(--carbon);transition:color .2s}
  .nav-links a:hover{color:var(--rouge)}
  .btn{display:inline-block;font-weight:700;font-size:14px;letter-spacing:.02em;padding:11px 22px;border-radius:4px;transition:background .2s}
  .btn-rouge{background:var(--rouge);color:#fff}
  .btn-rouge:hover{background:var(--rouge-hover)}
  .nav-toggle{display:none;background:none;border:0;width:36px;height:36px;cursor:pointer;position:relative}
  .nav-toggle span{position:absolute;left:7px;width:22px;height:2px;background:var(--carbon);transition:transform .25s,opacity .25s}
  .nav-toggle span:nth-child(1){top:11px}
  .nav-toggle span:nth-child(2){top:17px}
  .nav-toggle span:nth-child(3){top:23px}
  .nav.open .nav-toggle span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .nav.open .nav-toggle span:nth-child(2){opacity:0}
  .nav.open .nav-toggle span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

  /* MAIN — vide, à remplir (vidéos d'utilisation) */
  main{min-height:60vh;padding:80px 0}

  /* FOOTER */
  footer{background:var(--carbon);color:var(--steel);padding:48px 0;font-size:13px}
  footer .disclaimer{max-width:760px;margin-bottom:16px}
  footer .copy{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase}

  @media(max-width:860px){
    .wrap{padding:0 20px}
    .nav-toggle{display:block}
    .nav-right{gap:12px}
    .nav-links{display:none;position:absolute;top:72px;left:-20px;right:-20px;flex-direction:column;gap:0;background:var(--nearwhite);border-bottom:1px solid var(--hair)}
    .nav.open .nav-links{display:flex}
    .nav-links a{display:block;padding:16px 20px;border-top:1px solid var(--hair)}
  }
</style>
</head>
<body>

<nav class="nav" id="nav">
  <div class="wrap nav-inner">
    <a href="/" class="logo"><img src="/assets/logo.png" alt="CarboSteps"></a>
    <div class="nav-right">
      <ul class="nav-links">
        <li><a href="/#technology">The Technology</a></li>
        <li><a href="/#benefits">Benefits</a></li>
        <li><a href="/about.html">Our Story</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
      <a href="/#preorder" class="btn btn-rouge">Pre-order</a>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>

<main>
  <div class="wrap">
    <!-- Contenu de la page Welcome à venir -->
  </div>
</main>

<footer>
  <div class="wrap">
    <p class="disclaimer">These statements have not been evaluated by the Food and Drug Administration. CarboSteps is not intended to diagnose, treat, cure, or prevent any disease.</p>
    <p class="copy">© 2026 Carbosteps LLC · Patent pending</p>
  </div>
</footer>

<script>
  const nav=document.getElementById('nav'), t=nav.querySelector('.nav-toggle');
  t.addEventListener('click',()=>{const o=nav.classList.toggle('open');t.setAttribute('aria-expanded',o)});
  nav.querySelectorAll('.nav-links a').forEach(a=>a.addEventListener('click',()=>nav.classList.remove('open')));
  window.addEventListener('resize',()=>{if(innerWidth>860)nav.classList.remove('open')});
</script>
</body>
</html>
